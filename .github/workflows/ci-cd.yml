name: CI/CD Pipeline

on: 
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/Checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: $ {{ github.actor }}
          password: $
{{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        used: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/nehalreal-devops-project:latest
