name: DevSecOps Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Required for Trivy to upload results

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/nehal456/real-devops-project:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/nehal456/real-devops-project:latest'
          format: 'table'
          exit-code: '1' # This makes the pipeline FAIL if critical vulnerabilities are found!
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
  
      - name: Push Docker Image
        if: success() # Only push if the security scan passes!
        run: |
          docker push ghcr.io/nehal456/real-devops-project:latest
